name: Build mobile (EAS)
# Lancé à la main depuis l'onglet Actions. Nécessite le secret EXPO_TOKEN
# (compte Expo gratuit) : voir docs/tester-sur-telephone.md.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (development, preview, production)"
        default: preview
        required: true
      platform:
        description: "Plateforme (android, ios, all)"
        default: android
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le secret EXPO_TOKEN
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Ajoutez le secret EXPO_TOKEN (voir docs/tester-sur-telephone.md)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build -w @kapara/config -w @kapara/shared -w @kapara/design
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: eas build --non-interactive --no-wait --profile ${{ inputs.profile }} --platform ${{ inputs.platform }}
        working-directory: apps/mobile
