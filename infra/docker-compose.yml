# Local stack: PostgreSQL + PostGIS, optional Redis and LiveKit dev server.
services:
  db:
    image: postgis/postgis:17-3.5
    environment: { POSTGRES_USER: kapara, POSTGRES_PASSWORD: kapara, POSTGRES_DB: kapara }
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    profiles: [scale]
    ports: ["6379:6379"]
  livekit:
    image: livekit/livekit-server:latest
    profiles: [live]
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
volumes:
  db: {}
